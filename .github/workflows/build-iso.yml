name: Build LFS/BLFS system (fase 1+2+3+4)

# Reden om dit in de cloud te draaien i.p.v. lokaal: de LFS/BLFS-compile is
# te zwaar om op Brionize's eigen (24/7 productie-)machine te draaien. Zie
# BLUEPRINT.md / PROGRESS.md. Dit workflow-bestand bouwt dezelfde
# Docker-sandbox en scripts als scripts/build-local.sh — één bouwpad, twee
# omgevingen. De lokale variant blijft uitsluitend een bewuste, latere
# fallback-optie voor Brionize zelf, niet iets dat automatisch draait.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # Breed getriggerd op de hele scripts/-boom (i.p.v. elke submap los
      # opnoemen) — een vergeten submap (zoals scripts/lib/** hiervoor)
      # mag dit structureel niet meer kunnen missen.
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ruim onder de harde 360-min (6u) job-limiet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vrije schijfruimte vergroten
        # Standaard runner-tooling die we hier niet nodig hebben, opruimen
        # zodat de LFS-sourcebomen + build-artifacts (kunnen oplopen tot
        # 10-15GB+) passen binnen de beperkte vrije ruimte van de runner.
        run: |
          echo "Vrij vóór opschonen:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost || true
          docker system prune -af || true
          echo "Vrij na opschonen:"
          df -h /

      - name: Docker-image bouwen
        run: docker build -t brionize-lfs-toolchain:latest -f docker/Dockerfile.build .

      - name: Bootstrap-cache herstellen (indien beschikbaar)
        # Sleutel = hash van alles dat fase 1 + hoofdstuk 6+7 bepaalt. Blijft
        # de hash gelijk (scripts ongewijzigd), dan is er een cache-hit en
        # slaan we die hele bouw over. Verandert er iets in die scripts, dan
        # is de hash anders → cache-miss → gewoon opnieuw bouwen (nooit
        # stilzwijgend een verouderd checkpoint hergebruiken). Zie
        # BLUEPRINT.md "CI-strategie".
        #
        # Cachet EEN los tar-bestand, niet de $LFS-map rechtstreeks: hoofdstuk
        # 7 zet delen van $LFS root-only (bv. /root op 0750, /var/log/btmp op
        # 0600) — actions/cache draait zelf altijd als de gewone,
        # onbevoorrechte runner-user en kan zulke bestanden niet lezen/tar'en.
        # Een los tar-bestand (met root aangemaakt, hieronder) heeft zelf
        # normale rechten en is dus prima cachebaar.
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-bootstrap-cache.tar.zst
          key: lfs-bootstrap-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/lib/**') }}

      - name: Fase 1 + hoofdstuk 6+7 bouwen (of cache hergebruiken)
        # --privileged nodig voor de mount/chroot-stappen.
        run: |
          mkdir -p "$RUNNER_TEMP/lfs"
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 + hoofdstuk 6+7 ongewijzigd t.o.v. de laatst opgeslagen cache — uitpakken i.p.v. herbouwen."
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: geen cache voor deze hash (nieuwe of gewijzigde scripts) — fase 1 + hoofdstuk 6+7 volledig bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_CH8=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/01-toolchain/run-all.sh && bash /opt/lfs/scripts/02-base-system/run-all.sh"
          fi

      - name: Bootstrap-cache-archief bouwen (alleen bij cache-miss)
        # sudo nodig: zie uitleg bij de restore-stap hierboven. tar draait
        # hier als root en kan dus alles lezen; het archiefbestand zelf komt
        # weer bij de gewone runner-user te liggen zodat de cache-actie (die
        # nooit als root draait) het kan uploaden.
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst"

      - name: Bootstrap-cache opslaan (alleen bij cache-miss)
        # Zelfde key-expressie als de restore-stap hierboven (met opzet
        # herhaald i.p.v. een cache-actie-output te vertrouwen die we niet
        # ter plekke kunnen verifiëren) — moet identiek zijn, anders wordt
        # onder een andere key opgeslagen dan waarop later gezocht wordt.
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-bootstrap-cache.tar.zst
          key: lfs-bootstrap-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/lib/**') }}

      - name: Ch8-complete-cache herstellen (indien beschikbaar)
        # Tweede, bredere cache-laag: fase 1 + hoofdstuk 6+7+8 samen (~1u
        # bouwtijd). Zonder dit zou elke fase-3-iteratie hoofdstuk 8 opnieuw
        # moeten bouwen, ook als alleen fase-3-scripts wijzigen — exact de
        # verspilling die bij hoofdstuk 8 zelf al pijnlijk bleek. Zelfde
        # tar-bestand-i.p.v.-ruwe-map-aanpak als de bootstrap-cache hierboven.
        id: lfs-ch8-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-ch8-complete-cache.tar.zst
          key: lfs-ch8-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/lib/**') }}

      - name: Hoofdstuk 8 (volledig basissysteem) bouwen (of cache hergebruiken)
        # SKIP_BOOTSTRAP=true slaat hoofdstuk 6/7-pakketten over (al aanwezig
        # uit de vorige stap), maar mount/chroot draaien hier altijd opnieuw
        # (container-lokaal, niet cachebaar).
        run: |
          if [ "${{ steps.lfs-ch8-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 + hoofdstuk 6+7+8 ongewijzigd — uitpakken i.p.v. herbouwen (ook hoofdstuk 8 overgeslagen)."
            sudo rm -rf "$RUNNER_TEMP/lfs"
            mkdir -p "$RUNNER_TEMP/lfs"
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-ch8-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: hoofdstuk 8 nog bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_BOOTSTRAP=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/02-base-system/run-all.sh"
          fi

      - name: Ch8-complete-cache-archief bouwen (alleen bij cache-miss)
        if: steps.lfs-ch8-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-ch8-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-ch8-complete-cache.tar.zst"

      - name: Ch8-complete-cache opslaan (alleen bij cache-miss)
        if: steps.lfs-ch8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-ch8-complete-cache.tar.zst
          key: lfs-ch8-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/lib/**') }}

      - name: Xorg-complete-cache herstellen (indien beschikbaar)
        # Derde cache-laag: fase 1 + hoofdstuk 6+7+8 + fase 3a (Xorg-basis)
        # samen. Zonder dit zou elke latere fase-3-iteratie (GTK3-stack,
        # XFCE-kern, apps-laag) ook 03a (Xorg-libs+server) opnieuw moeten
        # bouwen. Zelfde tar-bestand-aanpak als de eerdere twee cache-lagen.
        id: lfs-xorg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-xorg-complete-cache.tar.zst
          key: lfs-xorg-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/lib/**') }}

      - name: Fase 3a (Xorg-basis) bouwen (of cache hergebruiken)
        # SKIP_GTK3_STACK=true bij een cache-miss: deze stap bouwt hier
        # bewust ALLEEN 03a (03b volgt hieronder als eigen, apart
        # gecachete stap) — zelfde gelaagde patroon als bootstrap/ch8.
        run: |
          if [ "${{ steps.lfs-xorg-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 t/m 03a ongewijzigd — uitpakken i.p.v. herbouwen (03a overgeslagen)."
            sudo rm -rf "$RUNNER_TEMP/lfs"
            mkdir -p "$RUNNER_TEMP/lfs"
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-xorg-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: 03a (Xorg-basis) nog bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_GTK3_STACK=true \
              -e SKIP_XFCE_CORE=true \
              -e SKIP_XFCE_EXTRAS=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/03-blfs-desktop/run-all.sh"
          fi

      - name: Xorg-complete-cache-archief bouwen (alleen bij cache-miss)
        if: steps.lfs-xorg-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-xorg-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-xorg-complete-cache.tar.zst"

      - name: Xorg-complete-cache opslaan (alleen bij cache-miss)
        if: steps.lfs-xorg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-xorg-complete-cache.tar.zst
          key: lfs-xorg-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/lib/**') }}

      - name: GTK3-complete-cache herstellen (indien beschikbaar)
        # Vierde cache-laag: alles hierboven + fase 3b (GTK3-supporting-
        # stack, incl. het zware LLVM/Mesa-duo). Zonder dit zou elke
        # latere fase-3-iteratie (XFCE-kern, apps-laag) ook 03b opnieuw
        # moeten bouwen — met LLVM alleen al veruit de zwaarste stap tot
        # nu toe. Zelfde tar-bestand-aanpak als de eerdere drie lagen.
        id: lfs-gtk3-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-gtk3-complete-cache.tar.zst
          key: lfs-gtk3-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/03-blfs-desktop/03b-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03b/**', 'scripts/lib/**') }}

      - name: Fase 3b (GTK3-supporting-stack) bouwen (of cache hergebruiken)
        # SKIP_XORG=true bij een cache-miss: 03a is al aanwezig (vorige
        # stap), deze docker-run bouwt hier bewust ALLEEN 03b.
        run: |
          if [ "${{ steps.lfs-gtk3-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 t/m 03b ongewijzigd — uitpakken i.p.v. herbouwen (03b overgeslagen)."
            sudo rm -rf "$RUNNER_TEMP/lfs"
            mkdir -p "$RUNNER_TEMP/lfs"
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-gtk3-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: 03b (GTK3-supporting-stack, incl. LLVM/Mesa) nog bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_XORG=true \
              -e SKIP_XFCE_CORE=true \
              -e SKIP_XFCE_EXTRAS=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/03-blfs-desktop/run-all.sh"
          fi

      - name: GTK3-complete-cache-archief bouwen (alleen bij cache-miss)
        if: steps.lfs-gtk3-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-gtk3-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-gtk3-complete-cache.tar.zst"

      - name: GTK3-complete-cache opslaan (alleen bij cache-miss)
        if: steps.lfs-gtk3-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-gtk3-complete-cache.tar.zst
          key: lfs-gtk3-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/03-blfs-desktop/03b-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03b/**', 'scripts/lib/**') }}

      - name: XFCE-core-complete-cache herstellen (indien beschikbaar)
        # Vijfde cache-laag: alles hierboven + fase 3c (XFCE-core, 17
        # pakketten + externe dependencies). Zonder dit zou elke latere
        # fase-3-iteratie (apps-laag) ook 03c opnieuw moeten bouwen.
        # Zelfde tar-bestand-aanpak als de eerdere vier lagen.
        id: lfs-xfce-core-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-xfce-core-complete-cache.tar.zst
          key: lfs-xfce-core-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/03-blfs-desktop/03b-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03b/**', 'scripts/03-blfs-desktop/03c-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03c/**', 'scripts/lib/**') }}

      - name: Fase 3c (XFCE-core) bouwen (of cache hergebruiken)
        # SKIP_XORG=true + SKIP_GTK3_STACK=true bij een cache-miss: 03a
        # en 03b zijn al aanwezig (vorige stappen), deze docker-run
        # bouwt hier bewust ALLEEN 03c.
        run: |
          if [ "${{ steps.lfs-xfce-core-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 t/m 03c ongewijzigd — uitpakken i.p.v. herbouwen (03c overgeslagen)."
            sudo rm -rf "$RUNNER_TEMP/lfs"
            mkdir -p "$RUNNER_TEMP/lfs"
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-xfce-core-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: 03c (XFCE-core) nog bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_XORG=true \
              -e SKIP_GTK3_STACK=true \
              -e SKIP_XFCE_EXTRAS=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/03-blfs-desktop/run-all.sh"
          fi

      - name: XFCE-core-complete-cache-archief bouwen (alleen bij cache-miss)
        if: steps.lfs-xfce-core-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-xfce-core-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-xfce-core-complete-cache.tar.zst"

      - name: XFCE-core-complete-cache opslaan (alleen bij cache-miss)
        if: steps.lfs-xfce-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-xfce-core-complete-cache.tar.zst
          key: lfs-xfce-core-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/03-blfs-desktop/03b-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03b/**', 'scripts/03-blfs-desktop/03c-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03c/**', 'scripts/lib/**') }}

      - name: XFCE-extras-complete-cache herstellen (indien beschikbaar)
        # Zesde cache-laag: alles hierboven + fase 3d (Conky-HUD,
        # window-tiling, 3 werkbladen/hotkeys). Zonder dit zou elke
        # latere fase-3-iteratie (apps-laag, fase 4) ook 03d opnieuw
        # moeten bouwen. Zelfde tar-bestand-aanpak als de eerdere vijf
        # lagen.
        id: lfs-xfce-extras-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-xfce-extras-complete-cache.tar.zst
          key: lfs-xfce-extras-complete-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/ch8-00-fetch-sources.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/02-base-system/inside-chroot-ch8/**', 'scripts/03-blfs-desktop/run-all.sh', 'scripts/03-blfs-desktop/03a-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03a/**', 'scripts/03-blfs-desktop/03b-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03b/**', 'scripts/03-blfs-desktop/03c-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03c/**', 'scripts/03-blfs-desktop/03d-00-fetch-sources.sh', 'scripts/03-blfs-desktop/inside-chroot-03d/**', 'scripts/lib/**') }}

      - name: Fase 3d (Conky/tiling/werkbladen) bouwen (of cache hergebruiken)
        # SKIP_XORG=true + SKIP_GTK3_STACK=true + SKIP_XFCE_CORE=true bij
        # een cache-miss: 03a/03b/03c zijn al aanwezig (vorige stappen),
        # deze docker-run bouwt hier bewust ALLEEN 03d.
        run: |
          if [ "${{ steps.lfs-xfce-extras-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 t/m 03d ongewijzigd — uitpakken i.p.v. herbouwen (03d overgeslagen)."
            sudo rm -rf "$RUNNER_TEMP/lfs"
            mkdir -p "$RUNNER_TEMP/lfs"
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-xfce-extras-complete-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: 03d (Conky/tiling/werkbladen) nog bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_XORG=true \
              -e SKIP_GTK3_STACK=true \
