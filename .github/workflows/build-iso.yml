name: Build LFS base system (fase 1+2)

# Reden om dit in de cloud te draaien i.p.v. lokaal: de LFS/BLFS-compile is
# te zwaar om op Brionize's eigen (24/7 productie-)machine te draaien. Zie
# BLUEPRINT.md / PROGRESS.md. Dit workflow-bestand bouwt dezelfde
# Docker-sandbox en scripts als scripts/build-local.sh — één bouwpad, twee
# omgevingen. De lokale variant blijft uitsluitend een bewuste, latere
# fallback-optie voor Brionize zelf, niet iets dat automatisch draait.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.build"
      - "scripts/01-toolchain/**"
      - "scripts/02-base-system/**"
      - "scripts/lib/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ruim onder de harde 360-min (6u) job-limiet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vrije schijfruimte vergroten
        # Standaard runner-tooling die we hier niet nodig hebben, opruimen
        # zodat de LFS-sourcebomen + build-artifacts (kunnen oplopen tot
        # 10-15GB+) passen binnen de beperkte vrije ruimte van de runner.
        run: |
          echo "Vrij vóór opschonen:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost || true
          docker system prune -af || true
          echo "Vrij na opschonen:"
          df -h /

      - name: Docker-image bouwen
        run: docker build -t brionize-lfs-toolchain:latest -f docker/Dockerfile.build .

      - name: Bootstrap-cache herstellen (indien beschikbaar)
        # Sleutel = hash van alles dat fase 1 + hoofdstuk 6+7 bepaalt. Blijft
        # de hash gelijk (scripts ongewijzigd), dan is er een cache-hit en
        # slaan we die hele bouw over. Verandert er iets in die scripts, dan
        # is de hash anders → cache-miss → gewoon opnieuw bouwen (nooit
        # stilzwijgend een verouderd checkpoint hergebruiken). Zie
        # BLUEPRINT.md "CI-strategie".
        #
        # Cachet EEN los tar-bestand, niet de $LFS-map rechtstreeks: hoofdstuk
        # 7 zet delen van $LFS root-only (bv. /root op 0750, /var/log/btmp op
        # 0600) — actions/cache draait zelf altijd als de gewone,
        # onbevoorrechte runner-user en kan zulke bestanden niet lezen/tar'en.
        # Een los tar-bestand (met root aangemaakt, hieronder) heeft zelf
        # normale rechten en is dus prima cachebaar.
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lfs-bootstrap-cache.tar.zst
          key: lfs-bootstrap-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/lib/**') }}

      - name: Fase 1 + hoofdstuk 6+7 bouwen (of cache hergebruiken)
        # --privileged nodig voor de mount/chroot-stappen.
        run: |
          mkdir -p "$RUNNER_TEMP/lfs"
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" = "true" ]; then
            echo "==> Cache-hit: hash van fase 1 + hoofdstuk 6+7 ongewijzigd t.o.v. de laatst opgeslagen cache — uitpakken i.p.v. herbouwen."
            sudo tar --zstd -xpf "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst" -C "$RUNNER_TEMP/lfs"
          else
            echo "==> Cache-miss: geen cache voor deze hash (nieuwe of gewijzigde scripts) — fase 1 + hoofdstuk 6+7 volledig bouwen."
            docker run --rm --privileged \
              -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
              -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
              -e SKIP_CH8=true \
              brionize-lfs-toolchain:latest \
              bash -c "bash /opt/lfs/scripts/01-toolchain/run-all.sh && bash /opt/lfs/scripts/02-base-system/run-all.sh"
          fi

      - name: Bootstrap-cache-archief bouwen (alleen bij cache-miss)
        # sudo nodig: zie uitleg bij de restore-stap hierboven. tar draait
        # hier als root en kan dus alles lezen; het archiefbestand zelf komt
        # weer bij de gewone runner-user te liggen zodat de cache-actie (die
        # nooit als root draait) het kan uploaden.
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar --zstd -cpf "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst" -C "$RUNNER_TEMP/lfs" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-bootstrap-cache.tar.zst"

      - name: Bootstrap-cache opslaan (alleen bij cache-miss)
        # Zelfde key-expressie als de restore-stap hierboven (met opzet
        # herhaald i.p.v. een cache-actie-output te vertrouwen die we niet
        # ter plekke kunnen verifiëren) — moet identiek zijn, anders wordt
        # onder een andere key opgeslagen dan waarop later gezocht wordt.
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lfs-bootstrap-cache.tar.zst
          key: lfs-bootstrap-${{ hashFiles('docker/Dockerfile.build', 'scripts/01-toolchain/**', 'scripts/02-base-system/run-all.sh', 'scripts/02-base-system/ch6-*.sh', 'scripts/02-base-system/ch7-*.sh', 'scripts/02-base-system/inside-chroot/**', 'scripts/lib/**') }}

      - name: Hoofdstuk 8 (volledig basissysteem) bouwen
        # Losse 'docker run': de vorige stap sloeg zijn checkpoint al op
        # (of gebruikte 'm al) vóórdat hoofdstuk 8 het $LFS-volume verder
        # aanpast. SKIP_BOOTSTRAP=true slaat hoofdstuk 6/7-pakketten over
        # (al aanwezig, uit de vorige stap), maar mount/chroot draaien hier
        # altijd opnieuw (container-lokaal, niet cachebaar).
        run: |
          docker run --rm --privileged \
            -v "$RUNNER_TEMP/lfs:/mnt/lfs" \
            -v "$GITHUB_WORKSPACE/scripts:/opt/lfs/scripts:ro" \
            -e SKIP_BOOTSTRAP=true \
            brionize-lfs-toolchain:latest \
            bash -c "bash /opt/lfs/scripts/02-base-system/run-all.sh"

      - name: Logs uploaden (ook bij falen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-system-logs
          path: ${{ runner.temp }}/lfs/sources/log-*.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: $LFS archiveren (voor latere fasen)
        # sudo nodig: hoofdstuk 7 heeft binnen de container delen van $LFS
        # naar root:root gechown't (met restrictieve rechten, bv. /root op
        # 0750) — deze losse workflow-stap draait als de gewone,
        # onbevoorrechte runner-gebruiker.
        if: success()
        run: |
          sudo tar -C "$RUNNER_TEMP/lfs" --exclude=sources -czf "$RUNNER_TEMP/lfs-base-system.tar.gz" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lfs-base-system.tar.gz"

      - name: Base-system-artifact uploaden
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-base-system-phase2
          path: ${{ runner.temp }}/lfs-base-system.tar.gz
          retention-days: 1
