-- Command Center — standaard Conky-HUD.
-- Gebaseerd op Conky's eigen officiële voorbeeldconfiguratie
-- (data/conky.conf uit de broncode), aangepast naar BLUEPRINT.md se
-- scope: CPU/RAM/opslag, Tailscale-status, logs. Wordt via
-- BUILD_BUILTIN_CONFIG bij het bouwen in de Conky-executable
-- ingebakken (tekst2c) — dus de standaard voor elke gebruiker, zonder
-- losse configuratiestap.
--
-- Tailscale zelf hoort bij fase 4 (devstack, nog niet gebouwd op dit
-- image) — de status-regel hieronder faalt dan gewoon stil
-- (2>/dev/null) i.p.v. de hele HUD te breken, en begint vanzelf te
-- werken zodra Tailscale in een latere fase geïnstalleerd wordt.

conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=11',
    gap_x = 24,
    gap_y = 48,
    minimum_height = 5,
    minimum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color grey}Command Center$color
$hr
${color grey}Uptime:$color $uptime
${color grey}CPU:$color $cpu% ${cpubar 4}
${color grey}RAM:$color $mem/$memmax - $memperc% ${membar 4}
${color grey}Opslag (/):$color ${fs_used /}/${fs_size /} ${fs_bar 4 /}
$hr
${color grey}Tailscale:$color ${execi 30 tailscale status 2>/dev/null | head -n 1 || echo "niet geinstalleerd"}
$hr
${color grey}Laatste logregels:$color
${execi 15 tail -n 3 /var/log/sys.log 2>/dev/null}
]]
